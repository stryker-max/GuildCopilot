name: CurseForge

# Veroeffentlicht das Addon auf CurseForge - ohne Handarbeit.
#
# Ausgeloest wird der Lauf von jedem Push nach main. Ob wirklich hochgeladen
# wird, entscheidet die Versionsnummer in der TOC: Gibt es zu ihr noch keinen
# Tag "v<version>", ist sie neu und geht raus; danach setzt der Lauf den Tag.
# Ein zweiter Push zur selben Version tut nichts mehr. Das ist absichtlich
# nicht "bei jedem Push hochladen" - CurseForge bekaeme sonst dieselbe Version
# mehrfach - und ebenso absichtlich nicht "bei jedem Tag", weil das wieder ein
# Handgriff waere.
#
# Einmalig einzurichten (Settings -> Secrets and variables -> Actions):
#   API-Token aus dem CurseForge-Konto
#   Projektnummer von der Projektseite
#
# Auf einen bestimmten NAMEN kommt es dabei nicht an. Empfohlen sind
# CURSEFORGE_TOKEN und CURSEFORGE_PROJECT_ID, gefunden wird beides aber auch
# unter jedem anderen Namen und in beiden Reitern - Secrets wie Variables.
# Erkannt wird es an der Gestalt des Werts: Die Projektnummer ist eine reine
# Zahl, der Token ist es nicht. Der Grund steht bei "Zugangsdaten suchen".
#
# Die Spielversion muss NICHT hinterlegt werden: Sie wird aus "## Interface:"
# der TOC abgeleitet (20506 -> 2.5.6). Nur falls CurseForge sie einmal anders
# benennt, gibt es die Notbremse CURSEFORGE_GAME_VERSION.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Freigabestufe"
        type: choice
        default: release
        options: [release, beta, alpha]
      force:
        description: "Auch hochladen, wenn der Tag zur Version schon steht"
        type: boolean
        default: false

# Zum Setzen des Versions-Tags nach erfolgreichem Upload.
permissions:
  contents: write

concurrency:
  group: curseforge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Version und Spielfassung bestimmen
        id: version
        env:
          GAME_VERSION_OVERRIDE: ${{ vars.CURSEFORGE_GAME_VERSION }}
        run: |
          set -euo pipefail
          toc="GuildCopilot/GuildCopilot.toc"
          version="$(sed -n 's/^## Version:[[:space:]]*//p' "$toc" | tr -d '\r')"
          interface="$(sed -n 's/^## Interface:[[:space:]]*//p' "$toc" | tr -d '\r')"
          if [ -z "$version" ] || [ -z "$interface" ]; then
            echo "In der TOC fehlt Version oder Interface." >&2
            exit 1
          fi
          if [ -n "${GAME_VERSION_OVERRIDE:-}" ]; then
            gameVersion="$GAME_VERSION_OVERRIDE"
          else
            # 20506 -> 2.5.6. So heisst die Fassung auch bei CurseForge.
            gameVersion="$((interface / 10000)).$(((interface % 10000) / 100)).$((interface % 100))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "gameVersion=$gameVersion" >> "$GITHUB_OUTPUT"
          echo "Addon $version, Spielfassung $gameVersion (Interface $interface)"

      # Zugangsdaten suchen, statt sie an einer Stelle zu verlangen.
      #
      # Die Einrichtung ist dreimal an einem Namen gescheitert: Der Token lag
      # als "CURSEFORGE" statt "CURSEFORGE_TOKEN" im Repository, und die
      # Projektnummer im falschen der beiden Reiter. Beides war eingetragen,
      # beides war richtig - nur hat der Lauf danach gesucht wie nach einer
      # Vokabel und dann behauptet, es sei nichts da.
      #
      # Ein Einrichtungsschritt, der am Namen scheitert, ist der Fehler, nicht
      # der Name. Nachgesehen wird deshalb unter allen Namen, die hier schon
      # vorgekommen sind oder naheliegen - und in BEIDEN Reitern, Secrets wie
      # Variables. Der erste Name, unter dem etwas steht, gewinnt.
      #
      # ACHTUNG, nicht "vereinfachen": Statt der Liste stand hier schon einmal
      # der Griff nach dem gesamten secrets-Kontext auf einmal. Das ist deutlich
      # kuerzer - aber GitHub sperrt einen Lauf, der das tut: Er endet sofort
      # mit "action_required" und null Jobs, laeuft also gar nicht erst.
      # Nachgewiesen an zwei Laeufen, die sich nur in diesem Punkt
      # unterschieden. Wer einen weiteren Namen braucht, haengt ihn unten an.
      #
      # Ausgegeben werden nur Namen, nie Werte. Ein Token, der versehentlich
      # unter "Variables" landet, ist nicht von Haus aus maskiert - deshalb
      # setzt dieser Schritt die Maskierung selbst, bevor irgendetwas laeuft.
      - name: Zugangsdaten suchen
        id: creds
        env:
          TOKEN_CANDIDATES: |
            CURSEFORGE_TOKEN=${{ secrets.CURSEFORGE_TOKEN }}
            CURSEFORGE=${{ secrets.CURSEFORGE }}
            CURSEFORGE_API_TOKEN=${{ secrets.CURSEFORGE_API_TOKEN }}
            CURSEFORGE_API_KEY=${{ secrets.CURSEFORGE_API_KEY }}
            CURSEFORGE_KEY=${{ secrets.CURSEFORGE_KEY }}
            CF_TOKEN=${{ secrets.CF_TOKEN }}
            CURSEFORGE_TOKEN (Variables)=${{ vars.CURSEFORGE_TOKEN }}
            CURSEFORGE (Variables)=${{ vars.CURSEFORGE }}
          PROJECT_CANDIDATES: |
            CURSEFORGE_PROJECT_ID=${{ vars.CURSEFORGE_PROJECT_ID }}
            CURSEFORGE_PROJECT=${{ vars.CURSEFORGE_PROJECT }}
            CURSEFORGE_PROJECTID=${{ vars.CURSEFORGE_PROJECTID }}
            CURSEFORGE_ID=${{ vars.CURSEFORGE_ID }}
            PROJECT_ID=${{ vars.PROJECT_ID }}
            CF_PROJECT_ID=${{ vars.CF_PROJECT_ID }}
            CURSEFORGE_PROJECT_ID (Secrets)=${{ secrets.CURSEFORGE_PROJECT_ID }}
            CURSEFORGE_PROJECT (Secrets)=${{ secrets.CURSEFORGE_PROJECT }}
            CURSEFORGE_PROJECTID (Secrets)=${{ secrets.CURSEFORGE_PROJECTID }}
            CURSEFORGE_ID (Secrets)=${{ secrets.CURSEFORGE_ID }}
            PROJECT_ID (Secrets)=${{ secrets.PROJECT_ID }}
        run: |
          set -euo pipefail

          # Erste Zeile mit einem Wert hinter dem Gleichheitszeichen gewinnt.
          # Zurueck kommt "Name<TAB>Wert"; ausgegeben wird spaeter nur der Name.
          first_filled() {
            printf '%s\n' "$1" | while IFS= read -r line; do
              case "$line" in
                *=?*) printf '%s\t%s\n' "${line%%=*}" "${line#*=}"; break ;;
              esac
            done
          }

          token_hit="$(first_filled "$TOKEN_CANDIDATES")"
          project_hit="$(first_filled "$PROJECT_CANDIDATES")"

          token_key="${token_hit%%$'\t'*}"
          token="${token_hit#*$'\t'}"
          project_key="${project_hit%%$'\t'*}"
          project="${project_hit#*$'\t'}"
          [ -n "$token_hit" ] || { token_key=""; token=""; }
          [ -n "$project_hit" ] || { project_key=""; project=""; }

          # Vertauscht? Die Projektnummer ist eine reine Zahl, der Token nicht.
          # Wer beides in die jeweils andere Zeile getippt hat, soll deshalb
          # nicht noch einmal von vorn anfangen muessen.
          if [ -n "$token" ] && [ -z "${token//[0-9]/}" ] && [ -n "$project" ] && [ -n "${project//[0-9]/}" ]; then
            echo "Token und Projektnummer sehen vertauscht aus - getauscht."
            swap_key="$token_key"; swap="$token"
            token_key="$project_key"; token="$project"
            project_key="$swap_key"; project="$swap"
          fi

          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "Token gefunden unter: $token_key"
            echo "CF_TOKEN=$token" >> "$GITHUB_ENV"
          else
            echo "Kein Token gefunden."
          fi
          if [ -n "$project" ]; then
            echo "Projektnummer gefunden unter: $project_key (Wert $project)"
            echo "CF_PROJECT=$project" >> "$GITHUB_ENV"
          else
            echo "Keine Projektnummer gefunden."
          fi

          {
            echo "hasToken=$([ -n "$token" ] && echo true || echo false)"
            echo "hasProject=$([ -n "$project" ] && echo true || echo false)"
            echo "names=Token: ${token_key:-nichts gefunden} / Projektnummer: ${project_key:-nichts gefunden}"
          } >> "$GITHUB_OUTPUT"

      # Der Tag ist das Gedaechtnis: Steht er, war diese Version schon oben.
      # Das haelt auch einem erneuten Lauf, einem Force-Push oder einem
      # nachgereichten Commit stand.
      - name: Ist die Version neu?
        id: check
        env:
          HAS_TOKEN: ${{ steps.creds.outputs.hasToken }}
          HAS_PROJECT: ${{ steps.creds.outputs.hasProject }}
          FOUND_NAMES: ${{ steps.creds.outputs.names }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          # Solange Token oder Projektnummer fehlen, ist nichts einzurichten
          # vergessen worden - es ist schlicht noch nicht eingerichtet. Der Lauf
          # sagt das und endet gruen; ein dauerhaft rotes Repository waere nur
          # Laerm, den man nach zwei Tagen ignoriert.
          #
          # Gesagt wird aber, WAS genau fehlt, und zwar auch in der
          # Zusammenfassung des Laufs: Eine Notiz an einem gruenen Haken sieht
          # niemand, der nicht ohnehin schon sucht.
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_PROJECT" != "true" ]; then
            missing=""
            if [ "$HAS_TOKEN" != "true" ]; then
              missing="der API-Token"
            fi
            if [ "$HAS_PROJECT" != "true" ]; then
              if [ -n "$missing" ]; then
                missing="$missing und die Projektnummer"
              else
                missing="die Projektnummer"
              fi
            fi
            echo "::notice::CurseForge ist nicht eingerichtet - es fehlt $missing. Version $tag wurde NICHT veroeffentlicht."
            {
              echo "## CurseForge: $tag wurde nicht veroeffentlicht"
              echo
              echo "Es fehlt **$missing**."
              echo
              # Was tatsaechlich im Repository steht, gehoert in die Meldung.
              # Ohne das raet man weiter am Namen herum - genau die Schleife,
              # aus der dieser Schritt herausfuehren soll.
              echo "Gefunden wurde: \`$FOUND_NAMES\`"
              echo
              echo "Der Name ist frei: Gesucht wird ueber alle Secrets UND Variables,"
              echo "die Projektnummer an ihrer Gestalt (reine Ziffern), der Token an seiner."
              echo "Nicht gefunden heisst also: Es ist wirklich keiner da - oder der Wert"
              echo "sieht nicht aus wie erwartet (Leerzeichen? halb eingefuegt?)."
              echo
              echo "Einzutragen unter *Settings -> Secrets and variables -> Actions*,"
              echo "empfohlene Namen:"
              echo
              echo "| Reiter | Name | Wert |"
              echo "| --- | --- | --- |"
              echo "| Secrets | \`CURSEFORGE_TOKEN\` | API-Token aus dem CurseForge-Konto |"
              echo "| Variables | \`CURSEFORGE_PROJECT_ID\` | Projektnummer von der Projektseite |"
              echo
              echo "Danach genuegt *Actions -> CurseForge -> Run workflow*;"
              echo "\`$tag\` geht dann nachtraeglich raus, ohne neuen Push."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Erzwungen - der vorhandene Tag $tag wird ignoriert."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag steht bereits - diese Version ist veroeffentlicht. Nichts zu tun."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag fehlt - Version ist neu."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Erst pruefen, dann veroeffentlichen. validate.mjs haelt unter anderem
      # die Versionsangaben im Repository zusammen.
      - name: Pruefen
        if: steps.check.outputs.publish == 'true'
        run: node tests/validate.mjs

      # Oberste Ebene ist der Ordner GuildCopilot. Der Companion-Ordner bleibt
      # draussen: CurseForge lehnt Archive mit ausfuehrbaren Dateien ab, und
      # dort liegen eine .cmd und eine .mjs.
      - name: Paket bauen
        id: package
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          zip_name="GuildCopilot-Addon-${version}.zip"
          rm -rf build && mkdir -p build/stage
          cp -r GuildCopilot build/stage/GuildCopilot
          rm -rf build/stage/GuildCopilot/Companion
          (cd build/stage && zip -r -X "../${zip_name}" GuildCopilot >/dev/null)
          echo "zip=build/${zip_name}" >> "$GITHUB_OUTPUT"

          echo "Inhalt:"
          unzip -Z1 "build/${zip_name}"
          if unzip -Z1 "build/${zip_name}" | grep -Eiq '\.(cmd|exe|mjs|bat|ps1|sh)$'; then
            echo "Das Archiv enthaelt ausfuehrbare Dateien - CurseForge lehnt das ab." >&2
            exit 1
          fi
          if unzip -Z1 "build/${zip_name}" | grep -qv '^GuildCopilot/'; then
            echo "Auf oberster Ebene steht mehr als der Ordner GuildCopilot." >&2
            exit 1
          fi

      - name: Hochladen
        if: steps.check.outputs.publish == 'true'
        env:
          CURSEFORGE_TOKEN: ${{ env.CF_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ env.CF_PROJECT }}
          CURSEFORGE_GAME_VERSION: ${{ steps.version.outputs.gameVersion }}
          CURSEFORGE_VERSION_TYPE: ${{ vars.CURSEFORGE_VERSION_TYPE }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ inputs.releaseType || 'release' }}
        run: node .github/scripts/curseforge-upload.mjs

      # Erst nach dem Upload. Ein Tag auf eine Version, die es nicht auf
      # CurseForge geschafft hat, wuerde jeden weiteren Versuch blockieren.
      - name: Version als veroeffentlicht markieren
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Auf CurseForge veroeffentlicht"
          git push origin "$tag"
          {
            echo "## Auf CurseForge veroeffentlicht: $tag"
            echo
            echo "Spielfassung ${{ steps.version.outputs.gameVersion }}, Tag \`$tag\` gesetzt."
            echo "Ein weiterer Push zu dieser Version laedt nichts mehr hoch."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.publish == 'true'
        with:
          name: GuildCopilot-Addon-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: warn
