name: CurseForge

# Veroeffentlicht das Addon auf CurseForge - ohne Handarbeit.
#
# Ausgeloest wird der Lauf von jedem Push nach main. Ob wirklich hochgeladen
# wird, entscheidet die Versionsnummer in der TOC: Gibt es zu ihr noch keinen
# Tag "v<version>", ist sie neu und geht raus; danach setzt der Lauf den Tag.
# Ein zweiter Push zur selben Version tut nichts mehr. Das ist absichtlich
# nicht "bei jedem Push hochladen" - CurseForge bekaeme sonst dieselbe Version
# mehrfach - und ebenso absichtlich nicht "bei jedem Tag", weil das wieder ein
# Handgriff waere.
#
# Einmalig einzurichten (Settings -> Secrets and variables -> Actions):
#   Secret   CURSEFORGE_TOKEN       API-Token aus dem CurseForge-Konto
#   Variable CURSEFORGE_PROJECT_ID  Projektnummer von der Projektseite
# Die Projektnummer wird auch als Secret angenommen - die beiden Reiter sind
# leicht zu verwechseln, und daran soll die Einrichtung nicht scheitern.
#
# Die Spielversion muss NICHT hinterlegt werden: Sie wird aus "## Interface:"
# der TOC abgeleitet (20506 -> 2.5.6). Nur falls CurseForge sie einmal anders
# benennt, gibt es die Notbremse CURSEFORGE_GAME_VERSION.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Freigabestufe"
        type: choice
        default: release
        options: [release, beta, alpha]
      force:
        description: "Auch hochladen, wenn der Tag zur Version schon steht"
        type: boolean
        default: false

# Zum Setzen des Versions-Tags nach erfolgreichem Upload.
permissions:
  contents: write

concurrency:
  group: curseforge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Version und Spielfassung bestimmen
        id: version
        env:
          GAME_VERSION_OVERRIDE: ${{ vars.CURSEFORGE_GAME_VERSION }}
        run: |
          set -euo pipefail
          toc="GuildCopilot/GuildCopilot.toc"
          version="$(sed -n 's/^## Version:[[:space:]]*//p' "$toc" | tr -d '\r')"
          interface="$(sed -n 's/^## Interface:[[:space:]]*//p' "$toc" | tr -d '\r')"
          if [ -z "$version" ] || [ -z "$interface" ]; then
            echo "In der TOC fehlt Version oder Interface." >&2
            exit 1
          fi
          if [ -n "${GAME_VERSION_OVERRIDE:-}" ]; then
            gameVersion="$GAME_VERSION_OVERRIDE"
          else
            # 20506 -> 2.5.6. So heisst die Fassung auch bei CurseForge.
            gameVersion="$((interface / 10000)).$(((interface % 10000) / 100)).$((interface % 100))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "gameVersion=$gameVersion" >> "$GITHUB_OUTPUT"
          echo "Addon $version, Spielfassung $gameVersion (Interface $interface)"

      # Der Tag ist das Gedaechtnis: Steht er, war diese Version schon oben.
      # Das haelt auch einem erneuten Lauf, einem Force-Push oder einem
      # nachgereichten Commit stand.
      - name: Ist die Version neu?
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CURSEFORGE_TOKEN != '' }}
          # Die Projektnummer ist kein Geheimnis und gehoert deshalb unter
          # "Variables". Sie steht dort aber in einem ANDEREN Reiter als der
          # Token, und genau daran ist die Einrichtung schon einmal gescheitert:
          # Token eingetragen, Projektnummer nicht gefunden, Lauf endet gruen und
          # laedt trotzdem nichts hoch. Beide Ablagen werden deshalb akzeptiert.
          HAS_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID != '' || secrets.CURSEFORGE_PROJECT_ID != '' }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          # Solange Token oder Projektnummer fehlen, ist nichts einzurichten
          # vergessen worden - es ist schlicht noch nicht eingerichtet. Der Lauf
          # sagt das und endet gruen; ein dauerhaft rotes Repository waere nur
          # Laerm, den man nach zwei Tagen ignoriert.
          #
          # Gesagt wird aber, WAS genau fehlt, und zwar auch in der
          # Zusammenfassung des Laufs: Eine Notiz an einem gruenen Haken sieht
          # niemand, der nicht ohnehin schon sucht.
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_PROJECT" != "true" ]; then
            missing=""
            if [ "$HAS_TOKEN" != "true" ]; then
              missing="das Secret CURSEFORGE_TOKEN"
            fi
            if [ "$HAS_PROJECT" != "true" ]; then
              if [ -n "$missing" ]; then
                missing="$missing und die Variable CURSEFORGE_PROJECT_ID"
              else
                missing="die Variable CURSEFORGE_PROJECT_ID"
              fi
            fi
            echo "::notice::CurseForge ist nicht eingerichtet - es fehlt $missing. Version $tag wurde NICHT veroeffentlicht."
            {
              echo "## CurseForge: $tag wurde nicht veroeffentlicht"
              echo
              echo "Es fehlt **$missing**."
              echo
              echo "Einzutragen unter *Settings -> Secrets and variables -> Actions*:"
              echo
              echo "| Reiter | Name | Wert |"
              echo "| --- | --- | --- |"
              echo "| Secrets | \`CURSEFORGE_TOKEN\` | API-Token aus dem CurseForge-Konto |"
              echo "| Variables | \`CURSEFORGE_PROJECT_ID\` | Projektnummer von der Projektseite |"
              echo
              echo "Die Projektnummer wird auch als Secret angenommen, falls sie dort landet."
              echo
              echo "Danach genuegt *Actions -> CurseForge -> Run workflow*;"
              echo "\`$tag\` geht dann nachtraeglich raus, ohne neuen Push."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Erzwungen - der vorhandene Tag $tag wird ignoriert."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag steht bereits - diese Version ist veroeffentlicht. Nichts zu tun."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag fehlt - Version ist neu."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Erst pruefen, dann veroeffentlichen. validate.mjs haelt unter anderem
      # die Versionsangaben im Repository zusammen.
      - name: Pruefen
        if: steps.check.outputs.publish == 'true'
        run: node tests/validate.mjs

      # Oberste Ebene ist der Ordner GuildCopilot. Der Companion-Ordner bleibt
      # draussen: CurseForge lehnt Archive mit ausfuehrbaren Dateien ab, und
      # dort liegen eine .cmd und eine .mjs.
      - name: Paket bauen
        id: package
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          zip_name="GuildCopilot-Addon-${version}.zip"
          rm -rf build && mkdir -p build/stage
          cp -r GuildCopilot build/stage/GuildCopilot
          rm -rf build/stage/GuildCopilot/Companion
          (cd build/stage && zip -r -X "../${zip_name}" GuildCopilot >/dev/null)
          echo "zip=build/${zip_name}" >> "$GITHUB_OUTPUT"

          echo "Inhalt:"
          unzip -Z1 "build/${zip_name}"
          if unzip -Z1 "build/${zip_name}" | grep -Eiq '\.(cmd|exe|mjs|bat|ps1|sh)$'; then
            echo "Das Archiv enthaelt ausfuehrbare Dateien - CurseForge lehnt das ab." >&2
            exit 1
          fi
          if unzip -Z1 "build/${zip_name}" | grep -qv '^GuildCopilot/'; then
            echo "Auf oberster Ebene steht mehr als der Ordner GuildCopilot." >&2
            exit 1
          fi

      - name: Hochladen
        if: steps.check.outputs.publish == 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSION: ${{ steps.version.outputs.gameVersion }}
          CURSEFORGE_VERSION_TYPE: ${{ vars.CURSEFORGE_VERSION_TYPE }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ inputs.releaseType || 'release' }}
        run: node .github/scripts/curseforge-upload.mjs

      # Erst nach dem Upload. Ein Tag auf eine Version, die es nicht auf
      # CurseForge geschafft hat, wuerde jeden weiteren Versuch blockieren.
      - name: Version als veroeffentlicht markieren
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Auf CurseForge veroeffentlicht"
          git push origin "$tag"
          {
            echo "## Auf CurseForge veroeffentlicht: $tag"
            echo
            echo "Spielfassung ${{ steps.version.outputs.gameVersion }}, Tag \`$tag\` gesetzt."
            echo "Ein weiterer Push zu dieser Version laedt nichts mehr hoch."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.publish == 'true'
        with:
          name: GuildCopilot-Addon-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: warn
